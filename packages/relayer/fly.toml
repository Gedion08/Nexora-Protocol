app = "nexora-relayer"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  NEXORA_ENV = "MAINNET"
  POLL_INTERVAL_MS = "15000"
  TX_WAIT_TIMEOUT_MS = "120000"
  MAX_RETRIES = "3"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health/live"

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
